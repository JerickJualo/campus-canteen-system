<table class="inventory-table">
    <thead>
        <tr>
            <th>Item</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td>{{ item.item_name }}</td>
            <td>PHP {{ item.unit_price }}</td>
            <td>{{ item.quantity_in_stock }}</td>
            <td>
                <button class="btn btn-success">Add</button>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4" class="empty-state">No items found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
