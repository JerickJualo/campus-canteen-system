{% extends 'base.html' %}
{% block content %}
{% include 'inventory/_inventory_styles.html' %}

<div class="inv-page inv-narrow">
    <div class="inv-header">
        <div>
            <h2 class="inv-title">Edit Inventory Item</h2>
            <p class="inv-subtitle">Update item details, pricing, and stock rules.</p>
        </div>
        <div class="inv-actions">
            <a href="{% url 'inventory_list' %}" class="btn btn-muted">Inventory List</a>
        </div>
    </div>

    <div class="form-container">
        <form method="post" class="inv-form">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button type="submit" class="btn btn-success">Save Changes</button>
                <a href="{% url 'inventory_list' %}" class="btn btn-muted">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
